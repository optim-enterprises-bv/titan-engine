[kernel]
begin = "// BEGIN GENERATED"
end = "// END GENERATED"
target = "../../oxide-kernels/gemm/src/main.rs"
name_template = "gemv_k{r.value}_{dt.name}{vec.suf}"
entry = '''    /// GEMV, {dt.name}, m <= {r.value}, B k-contiguous, a warp per column{vec.doc}
    #[kernel]
    #[launch_bounds(256, 1)]
    pub unsafe fn {name}(a: *const u8, b: *const u8, d: *mut u8, c: *const u8, bias: *const u8, m: i32, n: i32, k: i32, a_s0: i64, a_s1: i64, b_s0: i64, b_s1: i64, d_s0: i64, d_s1: i64, c_s0: i64, c_s1: i64, bias_s0: i64, bias_s1: i64, sa: i64, sb: i64, sd: i64, sc: i64, alpha: f32, beta: f32, ws: *mut f32, nsplit: i32) {{
        gemv_k_body::<{dt.dt}, {r.value}, {vec.b}, 8>(0, a, b, d, c, bias, m, n, k, a_s0, a_s1, b_s0, b_s1, d_s0, d_s1, c_s0, c_s1, bias_s0, bias_s1, sa, sb, sd, sc, alpha, beta);
    }}'''

[[axis]]
name = "dt"

[[axis.value]]
name = "f32"
dt = "DT_F32"

[[axis.value]]
name = "f16"
dt = "DT_F16"

[[axis.value]]
name = "bf16"
dt = "DT_BF16"

[[axis]]
name = "r"

[[axis.value]]
value = 1

[[axis.value]]
value = 2

[[axis.value]]
value = 4

[[axis.value]]
value = 8

[[axis]]
name = "vec"

[[axis.value]]
suf = "_v"
b = "true"
doc = ", 16-byte loads"

[[axis.value]]
suf = ""
b = "false"
doc = ""
