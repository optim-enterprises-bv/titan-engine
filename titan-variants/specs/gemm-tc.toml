bdoc = "n"
at = "false"
bt = "true"

[[axis.value]]
name = "mk"
adoc = "m"
bdoc = "k"
at = "true"
bt = "false"

[[axis.value]]
name = "mn"
adoc = "m"
bdoc = "n"
at = "true"
bt = "true"

[[axis]]
name = "bm"

[[axis.value]]
value = 128
words = 24576
