# Bonsai-27B Q1_0, dense (all on the GPU; fused Q1_0 mmvq decode and MMQ prefill). 32k context.
[[models]]
name = "bonsai-27b"
kind = "text"
model_id = "~/ai/models/bonsai/Bonsai-27B-gguf"
[models.format]
format = "gguf"
