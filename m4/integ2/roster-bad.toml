[models.device]
max_seq_len = 32768
[models.titan]
idle_ttl_secs = 1800

# Qwen3-14B Q5_K_M, dense. NOTE: this model's VRAM cost is dominated by the KV cache, not the
# weights: 40 layers x 2 x 8 kv_heads x 128 dim x 2 B = ~0.164 MB/token, so
#   64k ctx = 10.7 GB KV + 10.5 GB weights = 21.2 GB  -> does NOT fit -> auto_device_map
#             offloads layers to CPU and decode collapses to ~5 tok/s (not a model limit)
#   16k ctx =  2.7 GB KV + 10.5 GB weights = 13.2 GB  -> fits fully on the card
[[models]]
name = "qwen3-14b"
kind = "text"
model_id = "~/ai/models/qwen3-14b"
[models.format]
format = "gguf"
quantized_file = "Qwen3-14B-vanilla-Q5_K_M.gguf"
[models.device]
max_seq_len = 16384
[models.titan]
idle_ttl_secs = 1800
[models.titan.env]
TITAN_CUDA_GRAPHS = "1"
TITAN_CUDA_GRAPHS_RESERVE_MIB = "64"

# Qwen3.6-35B-A3B UD-IQ2_M (11.52 GB) - the i-quant path, PLAIN residency: no TITAN_TIERED, so no
# expert staging, no CPU twin, no prefill staging buffer. Every expert is GPU-resident (fraction 1.0)
# with ~4 GB of the 16 GB card left for KV + activations, which is what the tiered Q4_K_XL default
# cannot do (it packs ~14.1 GB and then fails prefill with CUDA_ERROR_OUT_OF_MEMORY).
# Requires the oxide i-quant fused-MoE arms (oxide-kernels @ 12c7422, gated bit-identical).
[[models]]
name = "qwen3.6-35b-iq2m"
kind = "text"
model_id = "~/ai/models/q35-lowbit"
[models.format]
format = "gguf"
quantized_file = "Qwen3.6-35B-A3B-UD-IQ2_M.gguf"
[models.device]
max_seq_len = 65536
[models.titan]
idle_ttl_secs = 1800
[models.titan.env]
# Non-tiering wins only: MTP speculative decode, piecewise CUDA graphs. Deliberately NO
# TITAN_TIERED / TITAN_PFS / TITAN_DOORBELL / TITAN_CPU_ONEPASS (those exist to stage experts
# off-GPU, which this model does not need) and no TITAN_PFS staging buffer.
TITAN_MTP = "2"
TITAN_CUDA_GRAPHS = "1"
TITAN_CUDA_GRAPHS_RESERVE_MIB = "64"

# Ternary Bonsai 2 27B (PrismML PTQ1_0 + prism Hadamard, dense qwen35 + dense MTP head; integ-20261002). All on the GPU.
# MTP 1 (80% acceptance, 8/8 greedy identical to MTP off); the template's own default effort (xhigh) runs long.
[[models]]
name = "bonsai2-27b"
kind = "text"
model_id = "~/ai/models/bonsai2-27b"
[models.format]
format = "gguf"
quantized_file = "Ternary-Bonsai-2-27B-PTQ1_0-mtp.gguf"
[models.device]
max_seq_len = 65536
[models.titan]
idle_ttl_secs = 1800
[models.titan.env]
TITAN_MTP = "1"
TITAN_REASONING_EFFORT = "medium"

# Spark-X2.5 4B Q4_K_M (spark2_5, dense; banded/windowed flash-prefill on the sliding layers). 16k context.
[[models]]
name = "spark-x2.5"
kind = "text"
model_id = "~/ai/models/spark-x2.5"
max_model_len = 16384
[models.format]
format = "gguf"
quantized_file = "Spark-X2.5-4B-Q4_K_M.gguf"
[models.device]
max_seq_len = 16384
[models.titan]
idle_ttl_secs = 1800

# Gemma 4 12B QAT Q4_0, text only. BF16 activations, all 48 layers on the GPU, 12k context. Prefix cache off for this
# model only (m4/pcache/README.md): each kept ~4k sequence pins ~0.4 GB of KV and the 6th ~4k prompt OOMs with the
# global 16; with 0, 6/6 pass at <= 10.2 GB and the outputs equal --prefix-cache-n 0's. The 35B keeps the global 16.
[[models]]
name = "gemma4-12b"
kind = "text"
model_id = "~/ai/models/gemma4-12b-qat"
dtype = "bf16"
max_model_len = 12288
[models.format]
format = "gguf"
quantized_file = "gemma-4-12b-it-qat-q4_0.gguf"
[models.device]
device_layers = ["0:48"]
max_seq_len = 12288
[models.titan]
idle_ttl_secs = 1800
prefix_cache_n = -1

# REDCELL 26B-A4B (gemma4 MoE; IQ4_NL expert down projections, unaligned-K prompts on the fused decode kernels).
# BF16, all 30 layers on the GPU, 8k context. Prefix cache off for this model only (m4/pcache/README.md): ~4k prompts
# peak at ~15.5 GB, so any kept KV (even a 1024 MiB byte cap) OOMs 3 of 7; with 0, 6/6 pass.
[[models]]
name = "redcell-26b"
kind = "text"
model_id = "~/ai/models/redcell-26b"
dtype = "bf16"
max_model_len = 8192
[models.format]
format = "gguf"
quantized_file = "REDCELL-26B-A4B-OSINT-Cyber-APEX-Mini.gguf"
[models.device]
device_layers = ["0:30"]
max_seq_len = 8192
[models.titan]
idle_ttl_secs = 1800
prefix_cache_n = -1
