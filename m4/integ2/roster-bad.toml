# titan-mistral model swap config (mistralrs from-config). One process serves every model below; one is resident at
# a time. A request naming an unloaded model unloads the resident one (its memory released) and loads it; requests
# arriving during the swap wait. An absent or unknown model name ("default", "gpt-4", ...) goes to the default model.
# [models.titan.env] holds each model's TITAN_* settings, applied while it is loaded (process env vars stay the
# defaults; "" unsets one). idle_ttl_secs unloads a model after that long without requests (0 or absent: never).
command = "serve"
default_model_id = "qwen3.6-35b"

[server]
host = "127.0.0.1"
port = 18640

[paged_attn]
mode = "off"

[titan_swap]
max_resident = 1

# The service model: tiered experts with the q35 profile, MTP=2, prefill streaming, doorbell + one-pass CPU misses,
# piecewise CUDA graphs, 64k context. Preloaded (default).
[[models]]
name = "qwen3.6-35b"
kind = "text"
model_id = "~/ai/models/Qwen3.6-35B-A3B-MTP"
[models.format]
format = "gguf"
quantized_file = "Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf"
[models.device]
max_seq_len = 65536
[models.titan.env]
TITAN_TIERED = "1"
TITAN_TIERED_GPU_FRACTION = "auto"
TITAN_TIERED_PROFILE = "~/titan-engine/m4/profile-q35.txt"
TITAN_TIERED_RESERVE_MIB = "1536"
TITAN_MTP = "2"
TITAN_PFS = "1"
TITAN_PFS_HEADROOM_MIB = "768"
TITAN_DOORBELL = "1"
TITAN_CPU_ONEPASS = "1"
TITAN_CUDA_GRAPHS = "1"
TITAN_CUDA_GRAPHS_RESERVE_MIB = "64"

# Same model, MXFP4 experts (m4/mxfp4-real-20260928.md: the Q4_K profile transfers, 93.9% hits); the service settings
# except MTP off: the MTP block's experts run candle's indexed MoE, which has no MXFP4 kernel.
[[models]]
name = "qwen3.6-35b-mxfp4"
kind = "text"
model_id = "~/ai/models/Qwen3.6-35B-A3B-MTP"
[models.format]
format = "gguf"
quantized_file = "Qwen3.6-35B-A3B-MXFP4_MOE.gguf"
[models.device]
max_seq_len = 65536
[models.titan]
idle_ttl_secs = 1800
[models.titan.env]
TITAN_TIERED = "1"
TITAN_TIERED_GPU_FRACTION = "auto"
TITAN_TIERED_PROFILE = "~/titan-engine/m4/profile-q35.txt"
TITAN_TIERED_RESERVE_MIB = "1536"
TITAN_MTP = "0"
TITAN_PFS = "1"
TITAN_PFS_HEADROOM_MIB = "768"
TITAN_DOORBELL = "1"
TITAN_CPU_ONEPASS = "1"
TITAN_CUDA_GRAPHS = "1"
TITAN_CUDA_GRAPHS_RESERVE_MIB = "64"

